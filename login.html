
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Dr Naglaa Platform</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

  <main class="login-container">

    <div class="login-decoration">✿</div>

    <div class="login-logo">N</div>

    <span class="login-eyebrow">DR NAGLAA PLATFORM</span>

    <h1>أهلًا بك ♡</h1>
    <p class="login-subtitle">سجّل الدخول لمتابعة رحلتك التعليمية</p>

    <form id="loginForm">

      <label class="form-label" for="number">كود الطالب</label>
      <input
        class="login-input"
        type="number"
        id="number"
        placeholder="your id"
        required
      >

      <div class="login-options">
        <label>
          <input type="checkbox" id="remember">
          تذكرني
        </label>
      </div>

      <button type="submit" class="login-button">
        تسجيل الدخول
      </button>

      <p class="login-message" id="loginMessage"></p>

    </form>

    <div class="login-divider"></div>

    <p class="signup-text">
      ليس لديك حساب؟
      <a href="#" id="signupLink">إنشاء حساب جديد</a>
    </p>

    <a href="index.html" class="back-home">العودة إلى الصفحة الرئيسية</a>

    <div class="login-footer">
      Dr Naglaa Platform · Academic Hub
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
